<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゲーム - WEREWOLF DEATH</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="game-page">
      <div class="game-header">
        <h1>WEREWOLF DEATH</h1>
        <div class="game-info-bar">
          <div class="game-info-item">
            <span class="label">役職</span>
            <span id="myRoleDisplay" class="value role-name-spectator">---</span>
          </div>
          <div class="game-info-item">
            <span class="label">フェーズ</span>
            <span id="phaseDisplay" class="value phase-name">待機中</span>
          </div>
          <div class="game-info-item">
            <span class="label">ターン</span>
            <span id="turnDisplay" class="value">1</span>
          </div>
        </div>
      </div>

      <div class="game-body">
        <div class="game-sidebar">
          <div class="section-card">
            <h2>生存者</h2>
            <div id="playerListSidebar"></div>
          </div>
          <div class="section-card">
            <h2>観戦者</h2>
            <div id="spectatorListSidebar" style="font-size:0.8rem;color:var(--text-secondary);">なし</div>
          </div>
        </div>

        <div class="game-main">
          <div class="action-panel" id="actionPanel">
            <div class="waiting-text">読み込み中...</div>
          </div>

          <div class="chat-area">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-row">
              <input type="text" id="chatInput" placeholder="メッセージを入力..." maxlength="200">
              <button class="btn btn-secondary btn-small" onclick="sendChat()">送信</button>
            </div>
          </div>

          <div class="game-log-area">
            <h3>ゲームログ</h3>
            <div id="gameLog"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/game.js"></script>
</body>
</html>
